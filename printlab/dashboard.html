<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Lab</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1d232c; --line: #2a313c;
    --text: #e6edf3; --muted: #8b96a5; --accent: #3fb950; --accent-ink: #04140a;
    --warn: #e3b341; --bad: #f85149; --blue: #58a6ff;
    --r: 14px;
    font-size: clamp(15px, 0.55vw + 10px, 22px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; }
  .app { display: grid; grid-template-columns: minmax(15rem, 19rem) minmax(0, 1fr); height: 100vh; }
  .app > * { min-width: 0; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 1.1rem 1.2rem .8rem; display: flex; align-items: center; gap: .6rem; }
  .brand h1 { font-size: 1.25rem; margin: 0; letter-spacing: .02em; }
  .brand .dot { width: .8rem; height: .8rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .list { overflow-y: auto; padding: .4rem .7rem 1rem; display: flex; flex-direction: column; gap: .5rem; }
  .card { display: grid; grid-template-columns: 4.2rem 1fr; gap: .75rem; align-items: center; text-align: left;
    background: var(--panel-2); border: 2px solid transparent; border-radius: var(--r); padding: .55rem; cursor: pointer; }
  .card:hover, .card:focus-visible { border-color: var(--line); outline: none; }
  .card.on { border-color: var(--accent); }
  .card img, .card .ph { width: 4.2rem; height: 4.2rem; object-fit: cover; object-position: 20% 50%; border-radius: 10px; background: #0b0e12; }
  .card b { display: block; font-size: .95rem; }
  .card small { color: var(--muted); font-size: .78rem; }
  .pill { display: inline-block; padding: .1rem .5rem; border-radius: 99px; font-size: .72rem; font-weight: 600; }
  .pill.ok { background: #12361c; color: var(--accent); }
  .pill.warn { background: #3a2e0f; color: var(--warn); }
  .pill.stale { background: #10263f; color: var(--blue); }
  .hint { color: var(--muted); font-size: .8rem; padding: .8rem 1.2rem 1.1rem; border-top: 1px solid var(--line); margin-top: auto; line-height: 1.45; }
  .hint code { background: var(--panel-2); padding: .05rem .35rem; border-radius: 6px; }

  main { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; min-width: 0; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; padding: 1.1rem 1.5rem .6rem; flex-wrap: wrap; }
  header h2 { margin: 0; font-size: 1.7rem; }
  header p { margin: .2rem 0 0; color: var(--muted); max-width: 60ch; font-size: .9rem; white-space: pre-line; }
  .actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); padding: .6rem 1rem; border-radius: 10px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .btn:disabled { opacity: .5; cursor: progress; }
  select.btn { padding-right: .6rem; }

  .stage { display: grid; grid-template-columns: 1fr minmax(16rem, 22rem); gap: 1rem; padding: 0 1.5rem; min-height: 0; }
  .viewer { position: relative; background: radial-gradient(ellipse at 50% 35%, #1c2430, #0b0e12 70%); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-height: 18rem; }
  .viewer canvas, .viewer img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .viewer .tag { position: absolute; left: .8rem; bottom: .7rem; color: var(--muted); font-size: .78rem; pointer-events: none; }
  .viewer .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 2rem; }
  .side { display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; min-height: 0; padding-bottom: .5rem; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: .9rem 1rem; }
  .box h3 { margin: 0 0 .6rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .param { display: grid; grid-template-columns: 1fr auto; gap: .1rem .6rem; align-items: center; padding: .35rem 0; border-top: 1px solid var(--line); }
  .param:first-of-type { border-top: 0; }
  .param label { font-weight: 600; font-size: .88rem; }
  .param small { grid-column: 1; color: var(--muted); font-size: .75rem; }
  .param .num { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: .25rem; }
  .param input { width: 4.6rem; text-align: right; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .35rem .45rem; }
  .param input.changed { border-color: var(--warn); }
  .param .unit { color: var(--muted); font-size: .75rem; }
  .warns { margin: 0; padding-left: 1.1rem; color: var(--warn); font-size: .85rem; }
  .warns li + li { margin-top: .3rem; }
  .ok-line { color: var(--accent); font-size: .9rem; margin: 0; }
  .dl { display: flex; flex-wrap: wrap; gap: .4rem; }
  .dl a { font-size: .8rem; padding: .35rem .65rem; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 1rem; padding: 1rem 1.5rem 1.3rem; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: .8rem 1rem; }
  .stat span { display: block; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
  .stat b { display: block; font-size: 1.6rem; margin-top: .2rem; font-variant-numeric: tabular-nums; }
  .stat em { font-style: normal; color: var(--muted); font-size: .8rem; }
  .stat.good b { color: var(--accent); } .stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); }

  .toast { position: fixed; right: 1.2rem; bottom: 1.2rem; max-width: min(40rem, calc(100vw - 2.4rem)); background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: .8rem 1rem; display: none; z-index: 5; }
  .toast.err { border-left-color: var(--bad); }
  .toast pre { margin: .5rem 0 0; max-height: 14rem; overflow: auto; font-size: .75rem; color: var(--muted); white-space: pre-wrap; }
  .toast .x { float: right; background: none; border: 0; cursor: pointer; color: var(--muted); }

  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    .list { flex-direction: row; overflow-x: auto; }
    .card { min-width: 14rem; }
    .hint { display: none; }
    header, .stage, .stats { padding-left: 16px; padding-right: 16px; }
    .stage { grid-template-columns: 1fr; }
    .viewer { height: 60vw; min-height: 16rem; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="dot"></span><h1>Print Lab</h1></div>
    <div class="list" id="list"></div>
    <div class="hint">New designs appear here when the <b>print-designer</b> agent adds them to <code>printlab/designs/</code>.<br>F11 = full screen.</div>
  </aside>
  <main>
    <header>
      <div><h2 id="title">Loading…</h2><p id="notes"></p></div>
      <div class="actions">
        <select class="btn" id="printer" title="Printer"></select>
        <button class="btn primary" id="build">Rebuild</button>
        <button class="btn" id="open">Open in Bambu Studio</button>
        <a class="btn" id="get3mf" href="#">Download .3mf</a>
      </div>
    </header>
    <section class="stage">
      <div class="viewer" id="viewer"><div class="empty" id="empty">Pick a design</div><span class="tag" id="tag"></span></div>
      <div class="side">
        <div class="box"><h3>Printability</h3><div id="checks"></div></div>
        <div class="box"><h3>Size it</h3><div id="params"></div></div>
        <div class="box"><h3>Files</h3><div class="dl" id="files"></div></div>
      </div>
    </section>
    <section class="stats" id="stats"></section>
  </main>
</div>
<div class="toast" id="toast"><button class="x" onclick="this.parentNode.style.display='none'">✕</button><div id="toastMsg"></div><pre id="toastLog"></pre></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
const $ = (id) => document.getElementById(id);
const COLORS = [0x2f9e44, 0x1971c2, 0xe8590c, 0x9c36b5, 0xf08c00];
let state = { designs: [], current: null, printers: [], viewer: null };
let lastSeen = "";
try { state.selected = localStorage.getItem("printlab.sel"); } catch {}

const fmt = (n, d = 0) => Number(n).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function toast(msg, log = "", err = false) {
  $("toastMsg").textContent = msg; $("toastLog").textContent = log;
  $("toastLog").style.display = log ? "block" : "none";
  $("toast").className = "toast" + (err ? " err" : ""); $("toast").style.display = "block";
  if (!err) setTimeout(() => ($("toast").style.display = "none"), 6000);
}

async function load(keep = true) {
  const r = await fetch("/api/designs"); const j = await r.json();
  state.designs = j.designs; state.printers = j.printers;
  if (!$("printer").options.length) {
    let saved = null; try { saved = localStorage.getItem("printlab.printer"); } catch {}
    $("printer").innerHTML = j.printers.map((p) => `<option>${p}</option>`).join("");
    $("printer").value = saved && j.printers.includes(saved) ? saved : j.default_printer;
  }
  const want = keep && state.selected && j.designs.find((d) => d.name === state.selected) ? state.selected : j.designs[0]?.name;
  renderList(); if (want) select(want, true);
  else { $("title").textContent = "No designs yet"; $("notes").textContent = "Ask the print-designer agent to make something."; }
}

function badge(d) {
  if (!d.report) return `<span class="pill stale">not built</span>`;
  if (d.stale) return `<span class="pill stale">edited</span>`;
  const w = d.report.parts.reduce((n, p) => n + p.warnings.length, 0);
  return w ? `<span class="pill warn">${w} warning${w > 1 ? "s" : ""}</span>` : `<span class="pill ok">ready</span>`;
}

function renderList() {
  $("list").innerHTML = state.designs.map((d) => `
    <button class="card ${d.name === state.selected ? "on" : ""}" data-n="${esc(d.name)}">
      ${d.report ? `<img alt="" src="/files/${d.name}.png?t=${d.report.built_at}">` : `<div class="ph"></div>`}
      <div><b>${esc(d.title)}</b><small>${d.report ? fmt(totalGrams(d.report) * 0.45) + " g · " : ""}</small>${badge(d)}</div>
    </button>`).join("");
  document.querySelectorAll(".card").forEach((c) => (c.onclick = () => select(c.dataset.n)));
}

const totalGrams = (rep) => rep.parts.reduce((g, p) => g + p.grams_pla, 0);

function select(name, quiet) {
  const d = state.designs.find((x) => x.name === name); if (!d) return;
  const sameBuild = state.current && state.current.name === name && state.current.report?.built_at === d.report?.built_at;
  state.selected = name; state.current = d; try { localStorage.setItem("printlab.sel", name); } catch {}
  document.querySelectorAll(".card").forEach((c) => c.classList.toggle("on", c.dataset.n === name));
  $("title").textContent = d.title; $("notes").textContent = d.notes;
  $("get3mf").href = `/files/${name}.3mf?download`;
  renderParams(d); renderChecks(d); renderStats(d); renderFiles(d);
  if (!(quiet && sameBuild)) showModel(d);
}

function renderParams(d) {
  if (!d.params.length) { $("params").innerHTML = `<p class="ok-line" style="color:var(--muted)">This design has no number parameters.</p>`; return; }
  $("params").innerHTML = d.params.map((p) => `
    <div class="param"><label for="p_${p.name}">${esc(p.name.toLowerCase().replace(/_/g, " "))}</label>
      <small>${esc(p.comment)}</small>
      <span class="num"><input id="p_${p.name}" data-k="${p.name}" data-v="${p.value}" type="number" step="any" inputmode="decimal" value="${p.value}"><span class="unit">mm</span></span>
    </div>`).join("");
  $("params").querySelectorAll("input").forEach((i) => (i.oninput = () => {
    i.classList.toggle("changed", Number(i.value) !== Number(i.dataset.v));
    $("build").textContent = $("params").querySelector(".changed") ? "Save & rebuild" : "Rebuild";
  }));
  $("build").textContent = "Rebuild";
}

function renderChecks(d) {
  const r = d.report;
  if (!r) { $("checks").innerHTML = `<p class="ok-line" style="color:var(--blue)">Not built yet. Press Rebuild.</p>`; return; }
  const warns = r.parts.flatMap((p) => p.warnings.map((w) => `<li><b>${esc(p.name)}:</b> ${esc(w)}</li>`));
  const stale = d.stale ? `<p class="ok-line" style="color:var(--blue)">The design file changed since this build. Rebuild to update.</p>` : "";
  $("checks").innerHTML = stale + (warns.length ? `<ul class="warns">${warns.join("")}</ul>` :
    `<p class="ok-line">✓ Fits the ${esc(r.printer)}, watertight, flat on the bed, no steep overhangs.</p>`);
}

function renderStats(d) {
  const r = d.report;
  if (!r) { $("stats").innerHTML = ""; return; }
  const sizes = r.parts.map((p) => p.size);
  const maxDim = [0, 1, 2].map((k) => Math.max(...sizes.map((s) => s[k])));
  const fits = r.parts.every((p) => p.fits);
  const watertight = r.parts.every((p) => p.watertight);
  const g = totalGrams(r);
  const warnN = r.parts.reduce((n, p) => n + p.warnings.length, 0);
  $("stats").innerHTML = [
    ["Parts", r.parts.length, r.parts.map((p) => p.name).join(", ")],
    ["Largest part", `${fmt(maxDim[0])}×${fmt(maxDim[1])}×${fmt(maxDim[2])}`, "mm (X × Y × Z)"],
    ["Filament", `~${fmt(g * 0.45)} g`, `PLA at 15% infill · ${fmt(g)} g if solid`],
    [`Fits ${r.printer}`, fits ? "Yes" : "No", `bed ${r.bed.join(" × ")} mm`, fits ? "good" : "bad"],
    ["Checks", warnN ? `${warnN} to review` : "All clear", watertight ? "watertight mesh" : "mesh has holes", warnN ? "warn" : "good"],
  ].map(([k, v, e, c = ""]) => `<div class="stat ${c}"><span>${esc(k)}</span><b>${esc(v)}</b><em>${esc(e)}</em></div>`).join("");
}

function renderFiles(d) {
  if (!d.report) { $("files").innerHTML = `<span style="color:var(--muted)">Nothing yet</span>`; return; }
  const t = d.report.built_at;
  $("files").innerHTML = [`${d.name}.3mf`, ...d.report.parts.map((p) => p.stl), `${d.name}.png`, `${d.name}_report.txt`]
    .map((f) => `<a class="btn" href="/files/${f}?download&t=${t}">${esc(f)}</a>`).join("");
}

// ---------------------------------------------------------------- 3D viewer
let three = null;
async function getThree() {
  if (three !== null) return three;
  try {
    const T = await import("three");
    const { STLLoader } = await import("three/addons/loaders/STLLoader.js");
    const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
    three = { T, STLLoader, OrbitControls };
  } catch (e) { console.warn("3D viewer unavailable, using preview image", e); three = false; }
  return three;
}

function clearViewer() {
  if (state.viewer) { state.viewer.stop(); state.viewer = null; }
  $("viewer").querySelectorAll("canvas, img").forEach((n) => n.remove());
}

async function showModel(d) {
  clearViewer();
  $("empty").style.display = d.report ? "none" : "grid";
  $("empty").textContent = d.report ? "" : "Not built yet. Press Rebuild.";
  $("tag").textContent = "";
  if (!d.report) return;
  const lib = await getThree();
  if (state.current !== d) return;
  if (!lib) { return showImage(d); }
  try { state.viewer = await makeViewer(lib, d); $("tag").textContent = "Shown as it sits on the print bed · drag to rotate · scroll to zoom · grid = 10 mm"; }
  catch (e) { console.warn(e); showImage(d); }
}

function showImage(d) {
  const img = new Image(); img.alt = `${d.title} preview`; img.src = `/files/${d.name}.png?t=${d.report.built_at}`;
  $("viewer").prepend(img); $("tag").textContent = "Preview image";
}

async function makeViewer({ T, STLLoader, OrbitControls }, d) {
  const host = $("viewer");
  const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  host.prepend(renderer.domElement);
  const scene = new T.Scene();
  const cam = new T.PerspectiveCamera(35, 1, 1, 5000);
  cam.up.set(0, 0, 1);
  scene.add(new T.HemisphereLight(0xdde6f0, 0x1a1f26, 1.1));
  const sun = new T.DirectionalLight(0xffffff, 1.6); sun.position.set(150, -250, 400); scene.add(sun);
  const loader = new STLLoader();
  const group = new T.Group(); let x = 0;
  for (const [i, p] of d.report.parts.entries()) {
    const geo = await loader.loadAsync(`/files/${p.stl}?t=${d.report.built_at}`);
    geo.computeBoundingBox(); geo.computeVertexNormals();
    const bb = geo.boundingBox;
    const mesh = new T.Mesh(geo, new T.MeshStandardMaterial({ color: COLORS[i % COLORS.length], roughness: .55, metalness: .05 }));
    mesh.position.set(x - bb.min.x, -(bb.min.y + bb.max.y) / 2, -bb.min.z);
    x += bb.max.x - bb.min.x + 10; group.add(mesh);
  }
  const box = new T.Box3().setFromObject(group); const c = box.getCenter(new T.Vector3());
  group.position.x -= c.x; scene.add(group);
  const size = box.getSize(new T.Vector3()); const span = Math.max(size.x, size.y, size.z);
  const gridN = Math.max(10, Math.ceil((Math.max(size.x, size.y) + 40) / 10) * 10);
  const grid = new T.GridHelper(gridN, gridN / 10, 0x3a4554, 0x262d37); grid.rotation.x = Math.PI / 2; scene.add(grid);
  const controls = new OrbitControls(cam, renderer.domElement);
  controls.target.set(0, 0, size.z / 3); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.2;
  cam.position.set(span * 1.3, -span * 1.9, span * 1.25);
  controls.addEventListener("start", () => (controls.autoRotate = false));
  const resize = () => { const w = host.clientWidth, h = host.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); };
  const ro = new ResizeObserver(resize); ro.observe(host); resize();
  let run = true;
  (function tick() { if (!run) return; controls.update(); renderer.render(scene, cam); requestAnimationFrame(tick); })();
  return { stop() { run = false; ro.disconnect(); controls.dispose(); renderer.dispose(); renderer.domElement.remove(); } };
}

// ---------------------------------------------------------------- actions
$("printer").onchange = () => { try { localStorage.setItem("printlab.printer", $("printer").value); } catch {} };

$("build").onclick = async () => {
  const d = state.current; if (!d) return;
  const params = {};
  $("params").querySelectorAll("input").forEach((i) => { if (Number(i.value) !== Number(i.dataset.v)) params[i.dataset.k] = Number(i.value); });
  $("build").disabled = true; const label = $("build").textContent; $("build").textContent = "Building…";
  try {
    const r = await fetch("/api/build", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: d.name, params, printer: $("printer").value }) });
    const j = await r.json();
    if (j.ok) toast(`Built ${d.title} in ${j.seconds}s`);
    else toast(r.status === 403 ? "Building only works on the laptop itself." : "Build failed", j.log, true);
    await load();
  } catch (e) { toast("Could not reach the dashboard server", String(e), true); }
  finally { $("build").disabled = false; if ($("build").textContent === "Building…") $("build").textContent = label; }
};

$("open").onclick = async () => {
  const d = state.current; if (!d) return;
  const r = await fetch("/api/open", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: d.name }) });
  const j = await r.json(); toast(j.log, "", !j.ok);
};

// Pick up new designs or rebuilds made by the agent, without interrupting typing.
setInterval(async () => {
  if (document.activeElement?.tagName === "INPUT" || $("build").disabled) return;
  try {
    const j = await (await fetch("/api/designs")).json();
    const sig = JSON.stringify(j.designs.map((d) => [d.name, d.modified, d.report?.built_at]));
    if (lastSeen && sig !== lastSeen) await load();
    lastSeen = sig;
  } catch {}
}, 5000);

load();
</script>
</body>
</html>
