name: Social auto-post

# Posts to Facebook + Instagram twice a day. Times are UTC.
# 14:00 UTC = 9am ET, 22:00 UTC = 5pm ET (adjust as you like).
on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install anthropic
      - name: Post to social
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEAD_URL: ${{ secrets.LEAD_URL }}
          IMAGE_URL: ${{ secrets.IMAGE_URL }}
          POST_IG_STORY: ${{ secrets.POST_IG_STORY }}
        run: python saas/social_bot.py
