<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get your website | Keystone Sites</title>
<meta name="description" content="Tell Keystone Sites about your business and send your photos. We'll build your website preview.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="/">Keystone Sites</a></div></header>

<section class="band soft"><div class="wrap form-wrap">
  <div class="head"><p class="eyebrow">Free preview</p><h2>Tell us about your business</h2><p>About 5 minutes. Fill in what you can; we'll fill the gaps and send you a preview link to approve.</p></div>

  <!-- Netlify reads this form when the site is published. Field names must stay the same: the dashboard uses them. -->
  <form class="request" name="website-request" method="POST" action="/thanks/" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" id="requestForm">
    <input type="hidden" name="form-name" value="website-request">
    <p class="hp"><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>

    <fieldset>
      <legend>Your business</legend>
      <div class="fields">
        <label class="f full">Business name *<input type="text" name="business_name" id="business_name" required autocomplete="organization"></label>
        <label class="f">What kind of business? <small>e.g. restaurant, barber, roofing</small><input type="text" name="business_type" id="business_type"></label>
        <label class="f">Business phone *<input type="tel" name="phone" id="phone" required autocomplete="tel"></label>
        <label class="f full">Address or area you serve<input type="text" name="address" id="address" autocomplete="street-address"></label>
        <label class="f full">Hours <small>e.g. Mon–Fri 8–6, Sat 9–2</small><input type="text" name="hours" id="hours"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>What you offer</legend>
      <div class="fields">
        <label class="f full">Services or menu items <small>One per line. Add prices if you want them shown.</small><textarea name="services" id="services" rows="5" placeholder="Smoke box: sliders, wings, fries, $25&#10;Chicken souse 20 oz, $15"></textarea></label>
        <label class="f full">About your business <small>How you started, what makes you different, areas you serve.</small><textarea name="about" id="about" rows="4"></textarea></label>
        <label class="f full">Colors or style you like <small>Optional. e.g. "red and gold like our sign", "clean and modern"</small><input type="text" name="style" id="style"></label>
        <label class="f full">Links <small>Your Instagram, Facebook, Google listing, online ordering, YouTube or TikTok videos</small><textarea name="links" id="links" rows="2"></textarea></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Photos, logo &amp; video</legend>
      <div class="fields">
        <div class="full">
          <label class="drop" for="photoPicker"><strong>Add photos (up to 8)</strong><span class="hint">Your food, work, storefront, team. Tap to choose from your phone.</span>
            <input type="file" id="photoPicker" accept="image/*" multiple></label>
          <div class="thumbs" id="thumbs"></div>
        </div>
        <div>
          <label class="drop" for="logoPicker"><strong>Add your logo</strong><span class="hint" id="logoName">Optional</span>
            <input type="file" id="logoPicker" accept="image/*"></label>
        </div>
        <div>
          <label class="drop" for="videoPicker"><strong>Add a short video</strong><span class="hint" id="videoName">Optional, under 5 MB. Longer? Paste a link above.</span>
            <input type="file" id="videoPicker" accept="video/mp4,video/quicktime"></label>
        </div>
      </div>
      <!-- These file fields carry the uploads; the pickers above fill them in. -->
      <div class="hidden-files" aria-hidden="true">
        <input type="file" name="logo" tabindex="-1"><input type="file" name="video" tabindex="-1">
        <input type="file" name="photo1" tabindex="-1"><input type="file" name="photo2" tabindex="-1"><input type="file" name="photo3" tabindex="-1"><input type="file" name="photo4" tabindex="-1">
        <input type="file" name="photo5" tabindex="-1"><input type="file" name="photo6" tabindex="-1"><input type="file" name="photo7" tabindex="-1"><input type="file" name="photo8" tabindex="-1">
      </div>
    </fieldset>

    <fieldset>
      <legend>How we reach you</legend>
      <div class="fields">
        <label class="f">Your name *<input type="text" name="owner_name" id="owner_name" required autocomplete="name"></label>
        <label class="f">Email *<input type="email" name="email" id="email" required autocomplete="email"></label>
        <label class="f full">Anything else?<textarea name="notes" id="notes" rows="2"></textarea></label>
        <label class="check full"><input type="checkbox" name="text_ok" id="text_ok" value="yes"><span>Keystone Sites may text me about my website preview at the phone number above. Message and data rates may apply. Reply STOP to opt out.</span></label>
        <label class="check full"><input type="checkbox" name="photo_rights" id="photo_rights" value="yes" required><span>I own the photos and logo I'm sending, or have permission to use them, and Keystone Sites may use them to build my website. *</span></label>
      </div>
    </fieldset>

    <div>
      <button class="btn btn-amber" type="submit" id="submitBtn">Send my information</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </form>
</div></section>

<footer class="foot"><div class="wrap"><span>© 2026 Keystone Sites · South Florida</span></div></footer>

<script>
(function () {
  var MAX_PHOTOS = 8, LIMIT = 7.5 * 1024 * 1024; // Netlify forms take about 8 MB per submission
  var form = document.getElementById("requestForm"), status = document.getElementById("status");
  var photos = [], logo = null, video = null;

  function say(msg, cls) { status.textContent = msg; status.className = "status " + (cls || ""); }

  // Shrink a photo in the browser so phone photos (often 3–6 MB) fit the upload limit.
  function shrink(file, maxSide, type, quality) {
    return new Promise(function (resolve) {
      if (!/^image\//.test(file.type)) return resolve(file);
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var s = Math.min(1, maxSide / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) {
          if (!b) return resolve(file);
          var ext = type === "image/png" ? ".png" : ".jpg";
          resolve(new File([b], file.name.replace(/\.[^.]+$/, "") + ext, { type: type }));
        }, type, quality);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  function drawThumbs() {
    var box = document.getElementById("thumbs");
    box.innerHTML = "";
    photos.forEach(function (f, i) {
      var fig = document.createElement("figure");
      fig.style.backgroundImage = "url(" + URL.createObjectURL(f) + ")";
      var b = document.createElement("button");
      b.type = "button"; b.textContent = "✕"; b.setAttribute("aria-label", "Remove photo " + (i + 1));
      b.onclick = function () { photos.splice(i, 1); drawThumbs(); };
      fig.appendChild(b); box.appendChild(fig);
    });
  }

  document.getElementById("photoPicker").addEventListener("change", async function (e) {
    var files = Array.from(e.target.files || []);
    if (photos.length + files.length > MAX_PHOTOS) say("You can send up to " + MAX_PHOTOS + " photos. We kept the first ones.", "err");
    say("Preparing photos…");
    for (var i = 0; i < files.length && photos.length < MAX_PHOTOS; i++) photos.push(await shrink(files[i], 1600, "image/jpeg", 0.8));
    e.target.value = ""; drawThumbs(); say("");
  });
  document.getElementById("logoPicker").addEventListener("change", async function (e) {
    var f = e.target.files[0]; if (!f) return;
    logo = await shrink(f, 600, "image/png");
    document.getElementById("logoName").textContent = f.name;
  });
  document.getElementById("videoPicker").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (!f) return;
    if (f.size > 5 * 1024 * 1024) { video = null; e.target.value = ""; say("That video is too big to upload here. Paste a YouTube, TikTok or Instagram link in the Links box instead.", "err"); document.getElementById("videoName").textContent = "Too big. Use a link instead."; return; }
    video = f; document.getElementById("videoName").textContent = f.name; say("");
  });

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!form.reportValidity()) return;
    var fd = new FormData();
    Array.from(form.elements).forEach(function (el) {
      if (!el.name || el.type === "file") return;
      if (el.type === "checkbox") { if (el.checked) fd.append(el.name, el.value); return; }
      fd.append(el.name, el.value);
    });
    var total = 0;
    photos.forEach(function (f, i) { fd.append("photo" + (i + 1), f); total += f.size; });
    if (logo) { fd.append("logo", logo); total += logo.size; }
    if (video) { fd.append("video", video); total += video.size; }
    if (total > LIMIT) { say("Your files are a bit too big together (" + (total / 1048576).toFixed(1) + " MB). Remove the video or a few photos and try again.", "err"); return; }
    var btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.textContent = "Sending…"; say("Uploading your information" + (total ? " and files" : "") + "…");
    try {
      var r = await fetch("/", { method: "POST", body: fd });
      if (!r.ok) throw new Error(r.status);
      location.href = "/thanks/";
    } catch (err) {
      btn.disabled = false; btn.textContent = "Send my information";
      say("That didn't go through. Check your connection and try again.", "err");
    }
  });
})();
</script>
</body>
</html>
