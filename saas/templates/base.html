<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}LeadPilot{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon-32.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <meta name="theme-color" content="#4f46e5" />
  <style>
    :root { --bg:#060d1a; --panel:#0e1a2e; --panel2:#14263f; --line:rgba(96,165,250,.22);
            --accent:#3b82f6; --accent2:#8b5cf6; --text:#eaf3ff; --muted:#8ba3c7; --good:#34d399; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:"Segoe UI",Inter,system-ui,Arial,sans-serif;
           background:radial-gradient(1100px 600px at 50% -10%, #15294a 0%, var(--bg) 60%); color:var(--text); }
    a { color:var(--accent); text-decoration:none; }
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; }
    .logo { width:40px; height:40px; border-radius:12px; display:block; object-fit:cover; box-shadow:0 4px 12px rgba(2,6,23,.4); }
    .nav a { margin-left:16px; color:var(--muted); font-weight:600; }
    .nav a:hover { color:var(--text); }
    .wrap { max-width:1000px; margin:0 auto; padding:28px 20px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:26px; box-shadow:0 20px 45px rgba(2,6,23,.4); }
    .center { max-width:440px; margin:40px auto; }
    h1 { margin:0 0 6px; } h2 { margin:0 0 14px; }
    .muted { color:var(--muted); }
    label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
    input, select, textarea { width:100%; padding:13px; font-size:16px; border-radius:12px; background:#0a1526; color:var(--text); border:1px solid var(--line); font-family:inherit; }
    textarea { min-height:80px; resize:vertical; }
    .qr { width:150px; height:150px; background:#fff; border-radius:12px; padding:8px; }
    .row { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
    .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .btnrow button { margin-top:0; padding:11px 15px; font-size:14px; }
    .out { background:#0a1526; border:1px solid rgba(52,211,153,.35); border-radius:12px; padding:14px; margin-top:12px; white-space:pre-wrap; min-height:50px; }
    button, .btn { display:inline-block; cursor:pointer; border:none; border-radius:13px; padding:14px 20px; font-size:16px; font-weight:800; color:#fff;
                   background:linear-gradient(135deg,var(--accent),var(--accent2)); margin-top:18px; }
    button.full { width:100%; }
    .btn.ghost { background:rgba(96,165,250,.14); border:1px solid var(--line); }
    .error { background:rgba(248,113,113,.15); border:1px solid rgba(248,113,113,.4); color:#fecaca; padding:10px 12px; border-radius:10px; margin:8px 0; font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:18px 0; }
    .stat { background:linear-gradient(160deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:16px; padding:16px; }
    .stat .v { font-size:30px; font-weight:900; } .stat .k { color:var(--muted); font-size:13px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:12px 10px; border-bottom:1px solid var(--line); font-size:15px; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
    .tag { font-size:12px; padding:3px 10px; border-radius:999px; background:rgba(52,211,153,.18); color:var(--good); }
    .urlbox { background:#0a1526; border:1px solid var(--line); border-radius:12px; padding:12px; word-break:break-all; font-weight:700; color:var(--accent2); }
    .hero { text-align:center; padding:50px 0 10px; }
    .hero h1 { font-size:34px; }
    @media (max-width:640px){ .grid{ grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><img class="logo" src="/static/logo.png" alt="LeadPilot logo" /> LeadPilot</div>
    <div class="nav">
      {% if user %}
        <a href="/dashboard">Dashboard</a><a href="/team">Team</a><a href="/logout">Log out</a>
      {% else %}
        <a href="/login">Log in</a><a href="/signup">Sign up</a>
      {% endif %}
    </div>
  </div>
  <div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
